img_size: 176
modalities_count: 1
batch_size: 45
shuffle: True
drop_last: True
pin_memory: True
num_workers: 16
prefetch_factor: 1
output_dir: ${oc.env:PRETRAINED_CHECKPOINTS_ROOT}/${now:%Y-%m-%d}_${now:%H-%M}_Neurojepa_pretraining_high_res
checkpoints_dir: ${experiment.output_dir}
checkpointing_epochs: 2
seed: 42
accelerator: 'gpu'
metrics:
  path: ${oc.env:LOGS_PATH}
  run_name: 'neurojepa_pretraining_high_res'
  logging_interval: 1

transform:
  _target_: torchvision.transforms.Compose
  transforms:
    - _target_: nidl.volume.transforms.augmentation.RandomResizedCrop
      target_shape: [182, 218, 182]
      scale:
        _target_: builtins.tuple
        _args_:
          - [0.6, 1.0]
      p: 1.0
    - _target_: nidl.volume.transforms.preprocessing.CropOrPad
      target_shape: ${experiment.img_size}
    - _target_: nidl.volume.transforms.preprocessing.RobustRescaling
      out_min_max:
        _target_: builtins.tuple
        _args_:
          - [0.0, 1.0]
      percentiles:
        _target_: builtins.tuple
        _args_:
          - [0.5, 99.5]